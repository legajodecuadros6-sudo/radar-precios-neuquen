name: Actualización trazable de precios Neuquén
on:
  schedule:
    # Todos los días, 08:00 Argentina. Los registros conservan la fecha real de consulta.
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-price-sync
  cancel-in-progress: false
jobs:
  sync-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar importador y reglas de precios
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
      - name: Consultar fuentes sin inventar precios ni reemplazar fechas anteriores
        id: sync
        continue-on-error: true
        run: python3 scripts/scrapers/sync_verified_prices.py
      - name: Comprobar compilación
        run: npm run build
      - name: Verificar que el catálogo completo se publica
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const source=fs.readFileSync('src/data/live-prices.json','utf8'); const deployed=fs.readFileSync('dist/data/live-prices.json','utf8'); if (source !== deployed) throw Error('El catálogo publicado no coincide con la importación');"
      - name: Guardar datos e historial y estado de fuentes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/live-prices.json src/data/price-history.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore(prices): actualizar consultas verificadas e historial'
            git push
          fi
      - name: Avisar si falló la sincronización
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::La sincronización no pudo completarse. Revisar el resumen y el paso de consulta; las fuentes sin lectura nueva conservan sus fechas originales.'
          exit 1
