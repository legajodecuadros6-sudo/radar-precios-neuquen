name: Sincronización Automática de Precios Neuquén (Cron 3 AM)

on:
  schedule:
    # Ejecuta Lunes, Miércoles y Viernes a las 06:00 UTC (03:00 AM hora argentina ART)
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch: # Permite ejecución manual en cualquier momento desde GitHub Actions

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependencias de Node
        run: npm ci

      - name: Ejecutar Pipeline Multicanal de Precios
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/scrapers/sync_neuquen_prices.py

      - name: Validar Compilación y Tipos en React
        run: npm run build

      - name: Confirmar y Publicar Actualizaciones de Precios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/scrapers/precios_consolidados_neuquen.json scripts/supabase/sync_migration.sql src/data/database.ts
          if git diff --staged --quiet; then
            echo "No hay cambios de precios para comitear."
          else
            git commit -m "chore(prices): actualizacion periodica de precios Neuquen (Cron 3:00 AM) [skip ci]"
            git push
          fi
